# 介面主題：霧藍銀淺色風。台股慣例紅漲綠跌，所以 redColor／greenColor 維持紅＝漲、綠＝跌的語意，
# 其餘強調色用藍色，避免跟漲跌色混淆。自訂 CSS 在 src/ui.py。
[theme]
base = "light"
primaryColor = "#2864C5"
backgroundColor = "#F1F5FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#243F60"
borderColor = "#DCE5EF"
dataframeBorderColor = "#DCE5EF"
dataframeHeaderBackgroundColor = "#FFFFFF"
showWidgetBorder = true
redColor = "#D83C48"
greenColor = "#16845B"
blueColor = "#2864C5"
linkColor = "#2459A6"
linkUnderline = false
font = "'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif"
headingFont = "'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif"
codeFont = "'JetBrains Mono', Consolas, monospace"
baseFontSize = 16
headingFontSizes = ["1.6rem", "1.15rem", "1rem", "0.95rem", "0.9rem", "0.85rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.35rem"
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
chartCategoricalColors = ["#2864C5", "#966215", "#A78BFA", "#16845B", "#D83C48", "#38BDF8"]

[theme.sidebar]
textColor = "#EDF4FD"
backgroundColor = "#365575"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#64809D"

[client]
toolbarMode = "minimal"
